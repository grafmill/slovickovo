<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2763D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slovíčkovo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikony/ikona-180.png">
<link rel="icon" type="image/png" href="ikony/ikona-192.png">
<title>Slovíčkovo</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one centered column like an exercise book page; big tap targets; worksheets render as A4 sheets */
:root {
  --bg: #EAF2FB;
  --surface: #FFFFFF;
  --ink: #1C2840;
  --muted: #56667F;
  --line: #CFDCEB;
  --primary: #2763D6;
  --primary-ink: #FFFFFF;
  --accent: #FFB81C;
  --accent-soft: #FFF1CC;
  --good: #23905A;
  --good-soft: #DDF4E7;
  --bad: #D33F35;
  --bad-soft: #FDE3E0;
  --pic: #FFFFFF;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A2C; --surface: #1A2540; --ink: #EEF3FB; --muted: #A6B4CC; --line: #2E3C5C;
    --primary: #6C9EFF; --primary-ink: #0E1628; --accent: #FFC94D; --accent-soft: #3A3420;
    --good: #4CC27E; --good-soft: #173A2A; --bad: #FF7468; --bad-soft: #43201E; --pic: #F4F7FB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A2C; --surface: #1A2540; --ink: #EEF3FB; --muted: #A6B4CC; --line: #2E3C5C;
  --primary: #6C9EFF; --primary-ink: #0E1628; --accent: #FFC94D; --accent-soft: #3A3420;
  --good: #4CC27E; --good-soft: #173A2A; --bad: #FF7468; --bad-soft: #43201E; --pic: #F4F7FB;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.45; }
#app { max-width: 760px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; font-weight: 800; }
h2 { font-size: 1.7rem; font-weight: 800; }
h3 { font-size: 1.25rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .grow { flex: 1; min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 56px; height: 56px; flex: none; }
.brand small { display: block; font-size: .95rem; color: var(--muted); font-family: var(--font-body); font-weight: 400; }
.back { min-height: 52px; padding: 0 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); }

.big { min-height: 68px; padding: 12px 22px; border-radius: 18px; border: none; background: var(--primary); color: var(--primary-ink); font-size: 1.3rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; text-align: center; }
.big.alt { background: var(--accent); color: #1C2840; }
.big.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.big:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .big { flex: 1 1 200px; }

.lesson { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; text-align: left; cursor: pointer; width: 100%; background: var(--surface); border: 3px solid var(--line); border-radius: 22px; padding: 16px; }
.lesson:hover { border-color: var(--primary); }
.lesson .num { width: 72px; height: 72px; border-radius: 18px; background: var(--accent); color: #1C2840; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; display: grid; place-items: center; }
.lesson .pics { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.lesson .pics .pic { width: 40px; height: 40px; border-radius: 10px; }
.lesson.locked { cursor: default; opacity: .6; border-style: dashed; }
.lesson.locked .num { background: var(--line); color: var(--muted); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.exlist { display: flex; flex-direction: column; gap: 10px; }
.ex { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px 10px 10px; }
.ex .n { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; display: grid; place-items: center; }
.ex button.go { all: unset; cursor: pointer; display: flex; flex-direction: column; min-width: 0; padding: 4px 0; }
.ex button.go strong { font-size: 1.2rem; }
.ex button.go span { color: var(--muted); font-size: .95rem; }
.ex button.go:focus-visible { outline: 4px solid var(--accent); border-radius: 8px; }
.row > .printlink { align-self: center; }
.printlink { font-size: .9rem; color: var(--primary); font-weight: 700; text-decoration: none; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); white-space: nowrap; }
.ex.test .n { background: var(--primary); color: var(--primary-ink); }

.pic { background: var(--pic); border-radius: 18px; display: block; border: 2px solid var(--line); }
.pic svg { width: 100%; height: 100%; display: block; }

.flash { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.flash button { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.flash .pic { width: 96px; height: 96px; }
.flash .en { font-size: 1.35rem; font-weight: 700; }
.flash .sk { color: var(--muted); }

.progress { height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--good); border-radius: 999px; transition: width .3s; }
.qcount { font-family: var(--font-display); font-weight: 600; color: var(--muted); }

.question { align-items: center; text-align: center; }
.question .pic.lg { width: 170px; height: 170px; }
.sk-word { font-size: 1.5rem; font-weight: 700; }
.prompt { font-size: 1.15rem; color: var(--muted); }
.answer-input { width: 100%; max-width: 420px; min-height: 68px; font: inherit; font-size: 1.8rem; text-align: center; border-radius: 16px; border: 3px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 12px; }
.answer-input:focus { border-color: var(--primary); outline: none; }
.letters { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; font-size: 2rem; font-weight: 700; }
.letters span, .letters input { width: 44px; height: 58px; display: grid; place-items: center; text-align: center; font: inherit; }
.letters input { border-radius: 12px; border: 3px solid var(--primary); background: var(--accent-soft); color: var(--ink); padding: 0; }
.letters input:focus { outline: 4px solid var(--accent); }
.sentence { font-size: 1.6rem; font-weight: 700; line-height: 1.5; }
.blank { display: inline-block; min-width: 110px; border-bottom: 4px solid var(--accent); color: var(--primary); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
.options.one { grid-template-columns: 1fr; }
.opt { min-height: 72px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface); font-size: 1.35rem; font-weight: 700; cursor: pointer; padding: 10px 14px; }
.opt.sent { font-size: 1.15rem; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt.good { background: var(--good-soft); border-color: var(--good); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); }

.board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.board .col { display: flex; flex-direction: column; gap: 10px; }
.tile { min-height: 96px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 6px; font-size: 1.35rem; font-weight: 700; }
.tile .pic { width: 80px; height: 80px; border: none; }
.tile.sel { border-color: var(--primary); box-shadow: 0 0 0 4px var(--accent); }
.tile.done { cursor: default; color: #1C2840; }
.board.board8 .tile { min-height: 72px; font-size: 1.2rem; padding: 4px; }
.board.board8 .tile .pic { width: 60px; height: 60px; }
.board.board8 .col { gap: 8px; }
.tile.shake { animation: shake .35s; border-color: var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.feedback { border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 1.25rem; font-weight: 700; width: 100%; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .correct { color: var(--ink); }

.speak { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; flex: none; padding: 0; }
.speak svg { width: 26px; height: 26px; }

.score { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; line-height: 1; }
.stars { display: flex; gap: 8px; justify-content: center; }
.stars svg { width: 54px; height: 54px; }
.redo { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; }
.redo div { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--bad-soft); border-radius: 16px; padding: 10px; }
.redo .pic { width: 64px; height: 64px; }

.note { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; }
.sheets { display: flex; flex-direction: column; gap: 8px; }
.sheetbtn { all: unset; cursor: pointer; color: var(--primary); font-weight: 700; text-decoration: underline; padding: 4px 0; }
.sheetbtn:focus-visible { outline: 4px solid var(--accent); }
button.printlink { background: var(--surface); cursor: pointer; font-family: inherit; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 20; text-align: center; }
.toggle { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; }
.toggle input { width: 28px; height: 28px; }
footer.foot { text-align: center; }
footer.foot button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 1rem; padding: 12px; }

.mecard { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); border: 3px solid var(--accent); border-radius: 22px; padding: 10px 12px; }
.mecard-main { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; font-size: 1.05rem; }
.mecard-main:focus-visible { outline: 4px solid var(--accent); border-radius: 12px; }
.mecard-main .pic, .earned-row > .pic { width: 60px; height: 60px; flex: none; border-radius: 50%; }
.who { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.whobtn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); border: 3px solid var(--line); border-radius: 20px; padding: 12px 8px; cursor: pointer; font-size: 1.05rem; }
.whobtn:hover { border-color: var(--primary); }
.whobtn.cur { border-color: var(--accent); background: var(--accent-soft); }
.whobtn .pic { width: 84px; height: 84px; border-radius: 50%; }
.dip-avatar .pic { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--accent); }

.mecard > svg { width: 56px; height: 56px; }
.mestars { font-family: var(--font-display); font-size: 1.8rem; }
.go-arrow { font-size: 2rem; font-weight: 800; color: var(--muted); }
.plus { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.star-sm svg { width: 24px; height: 24px; display: block; }
.earned-row { display: flex; align-items: center; gap: 14px; }
.earned-row > svg { width: 64px; height: 64px; flex: none; }
.newsticker { background: var(--good-soft); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; width: 100%; }
.sticker { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: .9rem; }
.sticker .pic { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--accent); padding: 6px; }
.sticker.locked .pic { filter: grayscale(1); opacity: .35; border-style: dashed; border-color: var(--line); }
.sticker.locked span { color: var(--muted); }
.diploma { background: var(--surface); border: 6px double var(--accent); border-radius: 26px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.dip-logo svg { width: 64px; height: 64px; }
.dip-label { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: .12em; color: var(--primary); line-height: 1; }
.dip-name { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1.1; overflow-wrap: anywhere; }
.dip-level { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; background: var(--accent); color: #1C2840; border-radius: 999px; padding: 4px 18px; }
.dip-album { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
.dip-album .pic { width: 60px; height: 60px; }

.achcard { flex-direction: column; align-items: stretch; gap: 10px; }
.achtop { display: flex; gap: 10px; align-items: center; }
.mename { display: block; font-size: 1.2rem; overflow-wrap: anywhere; }
.wallet { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.wallet .star-sm svg { width: 30px; height: 30px; }
.achbtn { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--surface); border: 3px solid var(--accent); border-radius: 18px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); min-height: 72px; }
.achbtn:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.achbtn strong { font-family: var(--font-display); font-size: 1.35rem; display: block; line-height: 1.1; }
.achicon svg { width: 52px; height: 52px; display: block; }
.achstats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .95rem; color: var(--muted); }
.achstats b { color: var(--ink); font-size: 1.1rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--accent-soft); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; }
.stat span { font-size: .95rem; color: var(--muted); }
.stat.gold { background: var(--accent); } .stat.gold b, .stat.gold span { color: #1C2840; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; width: 100%; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; padding: 4px; font: inherit; color: var(--ink); font-size: .9rem; text-align: center; cursor: pointer; line-height: 1.2; }
.badge svg { width: 76px; height: 76px; }
.badge.locked svg { filter: grayscale(1); opacity: .3; }
.badge.locked strong { color: var(--muted); }
.dip-badges { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
.dip-badges svg { width: 56px; height: 56px; }
.dip-level.small { font-size: 1.05rem; display: inline-block; margin-top: 4px; }
.achhead h2 { overflow-wrap: anywhere; }
.dipbtn svg { width: 36px; height: 36px; }

.gamesbtn { border-color: #8E55C9; }
.gamecard.locked .pic { filter: grayscale(1); opacity: .45; }
.gamecard .pic { width: 72px; height: 72px; flex: none; }
.gamebox { padding: 12px; gap: 10px; }
.gamehud { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; font-size: 1.2rem; }
.ghint { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ghint strong { font-family: var(--font-display); font-size: 1.6rem; }
.ghint .pic.tiny { width: 40px; height: 40px; }
.gstats { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 1.3rem; white-space: nowrap; }
#glives { color: #E5443B; letter-spacing: 1px; } #glives .lost { opacity: .2; }
.gwrap { position: relative; touch-action: none; }
.gwrap canvas { display: block; border-radius: 14px; touch-action: none; }
.gover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgba(255,255,255,.9); color: #1C2840; border-radius: 14px; }
.gover[hidden] { display: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 64px); gap: 8px; justify-content: center; touch-action: manipulation; }
.dpad button { border: none; border-radius: 16px; background: var(--primary); color: var(--primary-ink); font-size: 1.6rem; cursor: pointer; user-select: none; -webkit-user-select: none; }
.dpad [data-dir="up"] { grid-column: 2; grid-row: 1; } .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; } .dpad [data-dir="down"] { grid-column: 2; grid-row: 2; } .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }

.qzlessons, .qztypes { display: flex; flex-direction: column; gap: 6px; }
.qzrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.qzrow b { min-width: 2ch; text-align: center; font-size: 1.3rem; font-family: var(--font-display); }
.stp { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); background: var(--surface); color: var(--primary); font-size: 1.5rem; font-weight: 800; cursor: pointer; }
.qztotal { font-weight: 700; } .qztotal.bad { color: var(--bad); }
.qzvar { display: flex; flex-direction: column; gap: 6px; padding-left: 12px; } .qzvar[hidden] { display: none; }
.qzview { overflow: hidden; width: 100%; }
.qzscale { transform-origin: top left; display: flex; flex-direction: column; gap: 12px; width: max-content; }
.qzscale .qsheet { box-shadow: 0 1px 8px rgba(0,0,0,.25); }

.sh-sk { font-size: 10.5pt; color: #555; }
.sh-keylist.wide { columns: 2; font-size: 12pt; line-height: 1.5; }
.sh-keylist.wide div { margin-bottom: 1.5mm; }
.help { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--primary); background: var(--surface); color: var(--primary); font-size: 1.5rem; font-weight: 800; cursor: pointer; flex: none; font-family: var(--font-display); }
.help[aria-expanded="true"] { background: var(--primary); color: var(--primary-ink); }
.help-text { background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: 1.1rem; }
.helpline { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.optrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.optrow .helpline { display: contents; }
.optrow .help-text { grid-column: 1 / -1; }
html:not(.has-voice) .speak, html:not(.has-voice) .voice-on, html.has-voice .voice-off { display: none !important; }
.avphoto { overflow: hidden; padding: 0 !important; }
.avphoto img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
.avpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.avopt { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface); border: 3px solid var(--line); border-radius: 18px; padding: 6px; cursor: pointer; font-weight: 700; font-size: .9rem; }
.avopt .pic { width: 60px; height: 60px; border-radius: 50%; border: none; }
.avopt.cur { border-color: var(--accent); background: var(--accent-soft); }
.avopt.upload .plusbig { width: 60px; height: 60px; border-radius: 50%; border: 3px dashed var(--line); display: grid; place-items: center; font-size: 2rem; color: var(--muted); }
.avopt.upload .pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

.hintbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 16px; border-radius: 999px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.hintcost { display: inline-flex; align-items: center; gap: 2px; }
.gone { opacity: .25; }

    if (added.length) toast(added.length === 1 ? `Nová lekcia ${added[0]} je odomknutá!` : `Nové lekcie sú odomknuté: ${added.join(', ')}`);
  }).catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
function saveLocal(href, filename) { const a = document.createElement('a'); a.href = href; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

/* =====================================================================
   PRACOVNÉ LISTY A4 — z tejto funkcie sa generujú PDF súbory na tlač
   ===================================================================== */
function sheetHTML(kind, lessonId) {
  rand = rng(kind.length * 1000 + (lessonId || 0) * 17 + 7);
  const ids = kind === 'summary' ? unlockedIds() : [lessonId];
  const all = ids.flatMap(id => lessonWords(lessonById(id)));
  const where = kind === 'summary' ? 'Súhrnný test · lekcie ' + ids.join(', ') : lessonById(lessonId).title;
  const ex = EXERCISES.find(e => e.kind === kind);
  const title = ex ? `${where} · Cvičenie ${ex.n}: ${ex.title}` : kind === 'test' ? `${where} · Test` : where;
  const pages = []; const keys = [];
  const page = (body, instr, i, n, isKey) => `<section class="sheet ${isKey ? 'sh-key' : ''}"><div class="sh-head"><b>Slovíčkovo · Angličtina 2. ročník</b><span>${isKey ? 'RIEŠENIE PRE RODIČA' : 'Meno: ____________________ &nbsp; Dátum: __________'}</span></div>
    <div class="sh-title">${isKey ? 'Riešenie: ' : ''}${esc(title)}</div>${instr ? `<p class="sh-instr">${instr}</p>` : ''}${body}<div class="sh-foot"><span>${esc(title)}</span><span>${isKey ? 'riešenie' : 'strana ' + i + ' / ' + n}</span></div></section>`;
  const chunk = (arr, size) => { const n = Math.ceil(arr.length / size); const per = Math.ceil(arr.length / n); const out = []; for (let i = 0; i < arr.length; i += per) out.push(arr.slice(i, i + per)); return out; };
  const cellPic = (w) => `<span class="sh-pic">${svg(PICS[w.pic])}</span>`;
  const patStr = (w) => hidePattern(w.en).map(c => c === null ? '_' : esc(c)).join(' ');
  const ws = shuffle(all);
  let no = 0;
  if (kind === 'write' || kind === 'letters') {
    const ch = chunk(ws, 15);
    ch.forEach((part, pi) => pages.push(page(`<div class="sh-grid">${part.map(w => { no++; keys.push(`<div>${no}. <b>${esc(w.en)}</b></div>`);
      return kind === 'write' ? `<div class="sh-cell"><span class="no">${no}.</span>${cellPic(w)}<span class="sk">${esc(w.sk)}</span><span class="sh-line"></span></div>`
        : `<div class="sh-cell"><span class="no">${no}.</span>${cellPic(w)}<span class="sk">${esc(w.sk)}</span><span class="sh-pattern">${patStr(w)}</span></div>`; }).join('')}</div>`,
      kind === 'write' ? 'Pozri sa na obrázok a slovenské slovo. Napíš slovo po anglicky na čiaru.' : 'Doplň chýbajúce písmenká namiesto čiarok. Potom celé slovo prečítaj nahlas.', pi + 1, ch.length)));
  } else if (kind === 'match') {
    const ch = chunk(ws, 10);
    ch.forEach((part, pi) => { const right = shuffle(part); const letters = 'ABCDEFGHIJ';
      pages.push(page(`<div class="sh-match">${part.map((w, i) => { no++; const r = right[i]; keys.push(`<div>${no}. → <b>${letters[right.indexOf(w)]}</b> (${esc(w.en)})</div>`);
        return `<div class="l"><b>${no}.</b><span class="pic">${svg(PICS[w.pic])}</span><span class="sh-dot"></span></div><div></div><div class="r"><span class="sh-dot"></span>${letters[i]}) ${esc(r.en)}</div>`; }).join('')}</div>`,
        'Spoj čiarou obrázok so správnym anglickým slovom.', pi + 1, ch.length)); });
  } else if (kind === 'sentence') {
    const ch = chunk(ws, 15);
    ch.forEach((part, pi) => pages.push(page(`<div class="sh-bank">${shuffle(part).map(w => `<span>${esc(w.en)}</span>`).join('')}</div>
      <div class="sh-sents">${part.map(w => { no++; keys.push(`<div>${no}. <b>${esc(w.en)}</b> <span class="sh-sk">${esc(w.sentSk)}</span></div>`); return `<div>${no}. ${sentHTML(w, '<span class="bl"></span>')}</div>`; }).join('')}</div>`,
      'Vyber slovo z rámčeka a napíš ho do vety. Každé slovo použi raz.', pi + 1, ch.length)));
  } else if (kind === 'which') {
    const ch = chunk(ws, 10);
    ch.forEach((part, pi) => { const right = shuffle(part); const letters = 'ABCDEFGHIJ';
      pages.push(page(`<div class="sh-match" style="grid-template-columns: 64mm 14mm 1fr">${part.map((w, i) => { no++; const r = right[i]; keys.push(`<div>${no}. ${esc(w.en)} → <b>${letters[right.indexOf(w)]}</b> <span class="sh-sk">${esc(w.sentSk)}</span></div>`);
        return `<div class="l"><b>${no}.</b><span class="pic">${svg(PICS[w.pic])}</span><b style="font-size:15pt">${esc(w.en)}</b><span class="sh-dot"></span></div><div></div><div class="r sent"><span class="sh-dot"></span>${letters[i]}) ${sentHTML(r, '_____')}</div>`; }).join('')}</div>`,
        'Spoj čiarou slovo s vetou, do ktorej patrí.', pi + 1, ch.length)); });
  } else {
    const per = kind === 'summary' ? 5 : 4; const pick = ws.slice(0, per * 4); const take = (k) => pick.slice(k * per, k * per + per); const total = per * 4;
    const secA = take(0), secB = take(1), secC = take(2), secD = take(3);
    const lettersD = shuffle(secD); const L = 'ABCDE';
    const body = `<div class="sh-sec"><h3>A) Napíš slovo po anglicky</h3><div class="sh-row5">${secA.map((w, i) => `<div class="sh-cell"><span class="no">${i + 1}.</span>${cellPic(w)}<span class="sk">${esc(w.sk)}</span><span class="sh-line"></span></div>`).join('')}</div></div>
      <div class="sh-sec"><h3>B) Doplň chýbajúce písmenká</h3><div class="sh-row5">${secB.map((w, i) => `<div class="sh-cell"><span class="no">${i + 1}.</span>${cellPic(w)}<span class="sh-pattern">${patStr(w)}</span></div>`).join('')}</div></div>
      <div class="sh-sec"><h3>C) Doplň slovo do vety</h3><div class="sh-bank">${shuffle(secC).map(w => `<span>${esc(w.en)}</span>`).join('')}</div><div class="sh-sents">${secC.map((w, i) => `<div>${i + 1}. ${sentHTML(w, '<span class="bl"></span>')}</div>`).join('')}</div></div>
      <div class="sh-sec"><h3>D) Napíš do rámčeka písmeno správneho slova</h3><div class="sh-bank">${lettersD.map((w, i) => `<span>${L[i]}) ${esc(w.en)}</span>`).join('')}</div><div class="sh-row5">${secD.map((w, i) => `<div class="sh-cell"><span class="no">${i + 1}.</span>${cellPic(w)}<span class="sh-box"></span></div>`).join('')}</div></div>
      <div class="row"><span class="sh-points">Body: ______ / ${total}</span></div>`;
    pages.push(page(body, '', 1, 1));
    keys.push(`<div><b>A)</b></div>`, ...secA.map((w, i) => `<div>${i + 1}. <b>${esc(w.en)}</b></div>`), `<div><b>B)</b></div>`, ...secB.map((w, i) => `<div>${i + 1}. <b>${esc(w.en)}</b></div>`),
      `<div><b>C)</b></div>`, ...secC.map((w, i) => `<div>${i + 1}. <b>${esc(w.en)}</b></div>`), `<div><b>D)</b></div>`, ...secD.map((w, i) => `<div>${i + 1}. <b>${L[lettersD.indexOf(w)]}</b> (${esc(w.en)})</div>`));
  }
  const keyBody = `<div class="sh-keylist${kind === 'sentence' || kind === 'which' ? ' wide' : ''}">${keys.join('')}</div>` + (kind === 'test' || kind === 'summary' ? '<p class="sh-instr">Za každú správnu odpoveď 1 bod. Slová s chybou si s dieťaťom zopakujte v aplikácii.</p>' : '');
  pages.push(page(keyBody, '', 0, 0, true));
  rand = Math.random;
  return pages.join('');
}
window.__sheet = (kind, lessonId) => { document.body.className = 'printmode'; document.body.innerHTML = sheetHTML(kind, lessonId); };
</script>
